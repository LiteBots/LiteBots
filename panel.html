<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Panel Klienta — Lite Solutions</title>
  <meta name="theme-color" content="#050815" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root{
      --bg0:#050815;
      --bg2:#0a1026;

      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.68);
      --stroke: rgba(255,255,255,.10);

      --a2:#00c2ff;

      --good:#2ef2a3;
      --warn:#ffcf5a;
      --bad:#ff5a6f;

      --r2: 16px;
      --r3: 22px;

      --shadow: 0 18px 48px rgba(0,0,0,.40);
      --ease: cubic-bezier(.16, 1, .3, 1);
      --speed: .22s;

      --pad: 18px;
      --sidebar: 270px;

      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    *{ box-sizing:border-box; margin:0; padding:0; }
    html, body{ height:100% !important; width:100% !important; }
    body{
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans";
      color: var(--text);
      overflow: hidden !important;
      background:
        radial-gradient(1000px 600px at 18% 10%, rgba(0,194,255,.10), transparent 60%),
        radial-gradient(900px 560px at 86% 22%, rgba(45,99,255,.10), transparent 58%),
        linear-gradient(180deg, var(--bg0), var(--bg2));
    }
    a{ color: inherit; text-decoration:none; }
    button{ font-family: inherit; }
    :focus-visible{ outline: 2px solid rgba(0,194,255,.65); outline-offset: 3px; border-radius: 10px; }

    /* ======= NAPRAWA: FULLSCREEN OVERLAY (ignoruje zewnętrzne wrappery) ======= */
    #app{
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      max-width: none !important;
      max-height: none !important;
      margin: 0 !important;
      padding: 0 !important;
      display: block !important;
    }

    .app{
      width: 100% !important;
      height: 100% !important;
      display:flex;
      align-items: stretch;
      justify-content: flex-start;
      max-width: none !important;
    }

    /* ===== LAYOUT ===== */
    .sidebar{
      width: var(--sidebar);
      flex: 0 0 var(--sidebar);
      border-right: 1px solid var(--stroke);
      background: linear-gradient(180deg, rgba(10,17,42,.95), rgba(10,17,42,.75));
      padding: calc(var(--pad) + var(--safe-top)) var(--pad) calc(var(--pad) + var(--safe-bottom));
      height: 100%;
      overflow: auto;
    }

    .brand{
      display:flex; align-items:center; gap: 12px;
      padding: 10px 12px;
      border-radius: var(--r2);
      background: rgba(255,255,255,.04);
      border: 1px solid var(--stroke);
      margin-bottom: 14px;
    }
    .brand img{ width: 34px; height: 34px; border-radius: 10px; }
    .brand strong{ font-weight: 950; letter-spacing: -.02em; }
    .brand small{ display:block; color: var(--muted); font-weight: 700; margin-top: 2px; }

    .nav{ display:flex; flex-direction:column; gap: 8px; margin-top: 10px; }
    .nav a{
      display:flex; align-items:center; gap: 10px;
      padding: 12px 12px;
      border-radius: var(--r2);
      border: 1px solid transparent;
      color: rgba(255,255,255,.78);
      background: rgba(255,255,255,.02);
      transition: transform var(--speed) var(--ease), background var(--speed) var(--ease), border-color var(--speed) var(--ease), color var(--speed) var(--ease);
      font-weight: 900;
      letter-spacing:.01em;
    }
    .nav a:hover{
      transform: translateY(-1px);
      background: rgba(255,255,255,.05);
      color: var(--text);
      border-color: rgba(255,255,255,.08);
    }
    .nav a.active{
      background: rgba(0,194,255,.10);
      border-color: rgba(0,194,255,.22);
      color: var(--text);
    }

    .main{
      flex: 1 1 auto;
      min-width: 0;
      height: 100%;
      overflow: auto;
      padding: calc(var(--pad) + var(--safe-top)) var(--pad) calc(var(--pad) + var(--safe-bottom));
    }

    /* ===== TOPBAR ===== */
    .topbar{
      display:flex; align-items:center; justify-content:space-between;
      gap: 12px;
      padding: 12px 14px;
      background: rgba(255,255,255,.03);
      border: 1px solid var(--stroke);
      border-radius: var(--r3);
      box-shadow: var(--shadow);
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .topbar h1{
      font-size: 1.05rem;
      font-weight: 950;
      letter-spacing: -.02em;
    }
    .crumb{
      color: var(--muted);
      font-weight: 750;
      font-size: .94rem;
      margin-top: 3px;
    }

    .userbox{
      display:flex; align-items:center; gap: 10px;
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.20);
      max-width: 62vw;
    }
    .avatar{
      width: 34px; height: 34px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      overflow:hidden;
      flex-shrink:0;
    }
    .avatar img{ width:100%; height:100%; object-fit: cover; display:block; }
    .user-meta{ min-width: 0; }
    .user-meta .nick{
      font-weight: 950;
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
      max-width: 280px;
    }
    .user-meta .id{
      color: var(--muted);
      font-weight: 750;
      font-size: .88rem;
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
      max-width: 280px;
    }

    .pill{
      display:inline-flex; align-items:center; gap: 8px;
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid rgba(0,194,255,.22);
      background: rgba(0,194,255,.10);
      font-weight: 950;
      cursor:pointer;
      transition: transform var(--speed) var(--ease), border-color var(--speed) var(--ease), background var(--speed) var(--ease);
      white-space: nowrap;
    }
    .pill:hover{ transform: translateY(-1px); border-color: rgba(0,194,255,.35); background: rgba(0,194,255,.13); }

    /* ===== CONTENT ===== */
    .content{ margin-top: 14px; display:grid; gap: 12px; }

    .card{
      background: rgba(255,255,255,.03);
      border: 1px solid var(--stroke);
      border-radius: var(--r3);
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .card h2{
      font-size: 1.05rem;
      font-weight: 950;
      letter-spacing: -.02em;
    }

    .toolbar{
      display:flex; gap: 10px; align-items:center; flex-wrap:wrap;
      margin-top: 12px;
    }
    .input{
      flex: 1;
      min-width: 220px;
      padding: 12px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.22);
      color: var(--text);
      font-weight: 700;
      outline:none;
    }
    .btn{
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color: var(--text);
      font-weight: 950;
      cursor:pointer;
      transition: transform var(--speed) var(--ease), background var(--speed) var(--ease), border-color var(--speed) var(--ease);
      white-space: nowrap;
    }
    .btn:hover{ transform: translateY(-1px); background: rgba(255,255,255,.08); border-color: rgba(0,194,255,.22); }
    .btn.primary{ border-color: rgba(0,194,255,.26); background: rgba(0,194,255,.12); }

    .statusline{
      display:flex; gap:10px; align-items:center; flex-wrap:wrap;
      margin-top: 10px;
      color: var(--muted);
      font-weight: 750;
      font-size: .93rem;
    }
    .dot{ width: 9px; height: 9px; border-radius:999px; background: rgba(255,255,255,.45); display:inline-block; }
    .dot.good{ background: var(--good); }
    .dot.warn{ background: var(--warn); }
    .dot.bad{ background: var(--bad); }

    .table-wrap{ overflow:auto; border-radius: 14px; border: 1px solid rgba(255,255,255,.10); margin-top: 12px; }
    table{
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
      background: rgba(0,0,0,.18);
    }
    th, td{
      padding: 12px 12px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      text-align: left;
      font-weight: 750;
      color: rgba(255,255,255,.84);
      vertical-align: top;
    }
    th{
      position: sticky;
      top: 0;
      background: rgba(10,16,38,.92);
      color: rgba(255,255,255,.90);
      font-weight: 950;
      z-index: 1;
    }
    tr:hover td{ background: rgba(255,255,255,.03); }

    .empty{
      padding: 16px;
      color: var(--muted);
      font-weight: 750;
      border: 1px dashed rgba(255,255,255,.16);
      border-radius: 14px;
      background: rgba(255,255,255,.02);
      margin-top: 12px;
    }

    .toast{
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(16px + var(--safe-bottom));
      background: rgba(0,0,0,.55);
      border: 1px solid rgba(255,255,255,.16);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 999px;
      box-shadow: var(--shadow);
      font-weight: 800;
      opacity: 0;
      pointer-events:none;
      transition: opacity .22s var(--ease), transform .22s var(--ease);
      max-width: 92vw;
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
      z-index: 999;
    }
    .toast.show{ opacity: 1; transform: translateX(-50%) translateY(-4px); }

    /* ===== MOBILE ===== */
    .mobile-top{ display:none; gap: 10px; align-items:center; }
    .burger{
      width: 44px; height: 44px;
      display:grid; place-items:center;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      cursor:pointer;
    }
    .burger svg{ width: 22px; height: 22px; color: rgba(255,255,255,.92); }

    @media (max-width: 980px){
      .app{ flex-direction:column; }
      .sidebar{
        width: auto;
        flex: 0 0 auto;
        height: auto;
        border-right: none;
        border-bottom: 1px solid var(--stroke);
        padding: calc(var(--pad) + var(--safe-top)) var(--pad) 12px;
        display: none;
      }
      .sidebar.open{ display:block; }
      .main{
        padding: 12px var(--pad) calc(var(--pad) + var(--safe-bottom));
        height: 100%;
      }
      .mobile-top{ display:flex; margin-bottom: 10px; }
      table{ min-width: 680px; }
    }

    @media (max-width: 520px){
      .userbox{ max-width: 78vw; }
      .user-meta .nick, .user-meta .id{ max-width: 42vw; }
      .pill span{ display:none; }
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script type="text/babel">
    const { useEffect, useMemo, useRef, useState } = React;

    const Icons = {
      Grid: (p) => (
        <svg {...p} viewBox="0 0 24 24" fill="none">
          <path d="M4 4h7v7H4V4zm9 0h7v7h-7V4zM4 13h7v7H4v-7zm9 0h7v7h-7v-7z" stroke="currentColor" strokeWidth="1.9" />
        </svg>
      ),
      Key: (p) => (
        <svg {...p} viewBox="0 0 24 24" fill="none">
          <path d="M7.5 14.5a5.5 5.5 0 118.8 4.2L14 21H11v-2H9v-2H7.5v-2.5z" stroke="currentColor" strokeWidth="1.9" strokeLinejoin="round"/>
          <path d="M16.2 7.8h.01" stroke="currentColor" strokeWidth="3" strokeLinecap="round"/>
        </svg>
      ),
      Ticket: (p) => (
        <svg {...p} viewBox="0 0 24 24" fill="none">
          <path d="M4.5 8.5a2 2 0 012-2h11a2 2 0 012 2v2a2 2 0 010 4v2a2 2 0 01-2 2h-11a2 2 0 01-2-2v-2a2 2 0 010-4v-2z" stroke="currentColor" strokeWidth="1.9" strokeLinejoin="round"/>
          <path d="M12 8.8v6.4" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeDasharray="2.2 2.2"/>
        </svg>
      ),
      Menu: (p) => (
        <svg {...p} viewBox="0 0 24 24" fill="currentColor">
          <path d="M4 7.5h16a1 1 0 000-2H4a1 1 0 000 2zm0 6h16a1 1 0 000-2H4a1 1 0 000 2zm0 6h16a1 1 0 000-2H4a1 1 0 000 2z"/>
        </svg>
      ),
      Logout: (p) => (
        <svg {...p} viewBox="0 0 24 24" fill="none">
          <path d="M10 7V6a2 2 0 012-2h7a2 2 0 012 2v12a2 2 0 01-2 2h-7a2 2 0 01-2-2v-1" stroke="currentColor" strokeWidth="1.9" strokeLinejoin="round"/>
          <path d="M3 12h10" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round"/>
          <path d="M7 8l-4 4 4 4" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      )
    };

    async function apiGetRaw(path) {
      const res = await fetch(path, {
        method: 'GET',
        credentials: 'include',
        headers: { 'Accept': 'application/json' },
      });

      const text = await res.text();
      let json = null;
      try { json = text ? JSON.parse(text) : null; } catch { json = null; }

      return { ok: res.ok, status: res.status, json };
    }

    async function apiGetList(path) {
      const { ok, status, json } = await apiGetRaw(path);

      if (ok) {
        const items = (json && (json.items ?? json.data ?? json)) ?? [];
        return Array.isArray(items) ? items : [];
      }
      if (status === 404 || status === 204) return [];

      const msg = (json && (json.error || json.message)) || `Błąd ${status}`;
      const err = new Error(msg);
      err.status = status;
      throw err;
    }

    async function apiGetMe(path) {
      const { ok, status, json } = await apiGetRaw(path);

      if (ok) return (json && (json.user ?? json)) ?? null;
      if (status === 404 || status === 204) return null;

      const msg = (json && (json.error || json.message)) || `Błąd ${status}`;
      const err = new Error(msg);
      err.status = status;
      throw err;
    }

    function useToast() {
      const [toast, setToast] = useState({ show:false, text:'' });
      const tRef = useRef(null);

      const push = (text) => {
        setToast({ show:true, text });
        clearTimeout(tRef.current);
        tRef.current = setTimeout(() => setToast(v => ({...v, show:false})), 2400);
      };

      useEffect(() => () => clearTimeout(tRef.current), []);
      return { toast, push };
    }

    function App(){
      const [tab, setTab] = useState('services');
      const [mobileSidebarOpen, setMobileSidebarOpen] = useState(false);

      const [me, setMe] = useState(null);
      const [meLoading, setMeLoading] = useState(true);
      const [meError, setMeError] = useState(null);

      const [services, setServices] = useState(null);
      const [licenses, setLicenses] = useState(null);
      const [tickets, setTickets] = useState(null);

      const [loading, setLoading] = useState({ services:false, licenses:false, tickets:false });
      const [error, setError] = useState({ services:null, licenses:null, tickets:null });

      const [query, setQuery] = useState('');
      const { toast, push } = useToast();

      const title = useMemo(() => {
        if (tab === 'services') return 'Moje usługi';
        if (tab === 'licenses') return 'Moje licencje';
        return 'Moje zgłoszenia';
      }, [tab]);

      const fetchMe = async () => {
        setMeLoading(true);
        setMeError(null);
        try{
          const user = await apiGetMe('/api/me');
          setMe(user);
        }catch(e){
          setMe(null);
          setMeError(e);
        }finally{
          setMeLoading(false);
        }
      };

      const fetchTabData = async (which) => {
        setLoading(s => ({...s, [which]: true}));
        setError(s => ({...s, [which]: null}));

        try{
          if (which === 'services') setServices(await apiGetList('/api/services'));
          if (which === 'licenses') setLicenses(await apiGetList('/api/licenses'));
          if (which === 'tickets') setTickets(await apiGetList('/api/tickets'));
        }catch(e){
          setError(s => ({...s, [which]: e}));
        }finally{
          setLoading(s => ({...s, [which]: false}));
        }
      };

      useEffect(() => { fetchMe(); }, []);
      useEffect(() => {
        fetchTabData(tab);
        setMobileSidebarOpen(false);
      }, [tab]);

      const logout = async () => {
        push('Wylogowano.');
      };

      const guard = () => {
        if (meError?.status === 401) {
          return (
            <div className="card">
              <h2>Brak sesji</h2>
              <div className="toolbar">
                <a className="btn primary" href="/auth/discord">Zaloguj przez Discord</a>
              </div>
            </div>
          );
        }
        return null;
      };

      const TopbarRight = () => {
        if (meLoading) {
          return (
            <div className="userbox">
              <div className="avatar"></div>
              <div className="user-meta">
                <div className="nick">Ładowanie…</div>
                <div className="id">Discord ID: —</div>
              </div>
            </div>
          );
        }

        if (!me) {
          return (
            <div className="userbox">
              <div className="avatar"></div>
              <div className="user-meta">
                <div className="nick">—</div>
                <div className="id">Discord ID: —</div>
              </div>
              <a className="pill" href="/auth/discord" title="Połącz">
                <span>Połącz</span>
              </a>
            </div>
          );
        }

        return (
          <div className="userbox">
            <div className="avatar">
              {me.discordAvatarUrl ? <img src={me.discordAvatarUrl} alt={me.discordNick || 'Avatar'} /> : null}
            </div>
            <div className="user-meta">
              <div className="nick" title={me.discordNick || ''}>{me.discordNick || '—'}</div>
              <div className="id" title={me.discordId || ''}>Discord ID: {me.discordId || '—'}</div>
            </div>
            <button className="pill" onClick={logout} type="button" title="Wyloguj">
              <Icons.Logout style={{width:18,height:18}} />
              <span>Wyloguj</span>
            </button>
          </div>
        );
      };

      const renderTable = (rows, columns, keyField='id') => {
        if (!Array.isArray(rows)) return null;

        if (rows.length === 0) return <div className="empty">Brak danych.</div>;

        const q = query.trim().toLowerCase();
        const filtered = !q ? rows : rows.filter(r => {
          try{
            return Object.values(r).some(v =>
              (typeof v === 'string' || typeof v === 'number') &&
              String(v).toLowerCase().includes(q)
            );
          }catch{ return false; }
        });

        return (
          <div className="table-wrap">
            <table>
              <thead>
                <tr>
                  {columns.map(c => <th key={c.key}>{c.label}</th>)}
                </tr>
              </thead>
              <tbody>
                {filtered.map((r, idx) => (
                  <tr key={(r && r[keyField]) ? r[keyField] : idx}>
                    {columns.map(c => (
                      <td key={c.key}>
                        {c.render ? c.render(r) : (r?.[c.key] ?? '—')}
                      </td>
                    ))}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        );
      };

      const Status = ({ isLoading, err }) => {
        const dotClass = err ? "bad" : (isLoading ? "warn" : "good");
        const text = isLoading ? "Ładowanie…" : err ? "Błąd." : "Gotowe.";
        return (
          <div className="statusline">
            <span className={"dot " + dotClass}></span>
            {text}
          </div>
        );
      };

      const TabView = () => {
        const g = guard();
        if (g) return g;

        const isLoading = loading[tab];
        const err = error[tab];

        if (tab === 'services') {
          const columns = [
            { key: 'name', label: 'Usługa' },
            { key: 'status', label: 'Status' },
            { key: 'createdAt', label: 'Utworzono' },
            { key: 'expiresAt', label: 'Wygasa' },
          ];
          return (
            <div className="card">
              <h2>Moje usługi</h2>
              <div className="toolbar">
                <input className="input" placeholder="Szukaj…" value={query} onChange={(e)=>setQuery(e.target.value)} />
                <button className="btn" onClick={() => fetchTabData('services')} type="button">Odśwież</button>
              </div>
              <Status isLoading={isLoading} err={err} />
              {isLoading ? <div className="empty">Ładowanie…</div> : (
                services == null ? <div className="empty">Brak danych.</div> : renderTable(services, columns)
              )}
            </div>
          );
        }

        if (tab === 'licenses') {
          const columns = [
            { key: 'product', label: 'Produkt' },
            { key: 'licenseKey', label: 'Klucz' },
            { key: 'status', label: 'Status' },
            { key: 'issuedAt', label: 'Wydano' },
            { key: 'expiresAt', label: 'Wygasa' },
          ];
          return (
            <div className="card">
              <h2>Moje licencje</h2>
              <div className="toolbar">
                <input className="input" placeholder="Szukaj…" value={query} onChange={(e)=>setQuery(e.target.value)} />
                <button className="btn" onClick={() => fetchTabData('licenses')} type="button">Odśwież</button>
              </div>
              <Status isLoading={isLoading} err={err} />
              {isLoading ? <div className="empty">Ładowanie…</div> : (
                licenses == null ? <div className="empty">Brak danych.</div> : renderTable(licenses, columns)
              )}
            </div>
          );
        }

        const columns = [
          { key: 'ticketId', label: 'Ticket ID' },
          { key: 'subject', label: 'Temat' },
          { key: 'status', label: 'Status' },
          { key: 'createdAt', label: 'Utworzono' },
          { key: 'updatedAt', label: 'Aktualizacja' },
        ];
        return (
          <div className="card">
            <h2>Moje zgłoszenia</h2>
            <div className="toolbar">
              <input className="input" placeholder="Szukaj…" value={query} onChange={(e)=>setQuery(e.target.value)} />
              <button className="btn" onClick={() => fetchTabData('tickets')} type="button">Odśwież</button>
              <button className="btn primary" onClick={() => push("OK")} type="button">Nowe zgłoszenie</button>
            </div>
            <Status isLoading={isLoading} err={err} />
            {isLoading ? <div className="empty">Ładowanie…</div> : (
              tickets == null ? <div className="empty">Brak danych.</div> : renderTable(tickets, columns)
            )}
          </div>
        );
      };

      const setTabAndClear = (next) => {
        setQuery('');
        setTab(next);
      };

      return (
        <div className="app">
          <aside className={"sidebar " + (mobileSidebarOpen ? "open" : "")}>
            <div className="brand">
              <img src="https://i.imgur.com/TbvImJS.png" alt="Lite Solutions" />
              <div style={{minWidth:0}}>
                <strong>Lite Solutions</strong>
                <small>Panel Klienta</small>
              </div>
            </div>

            <nav className="nav" aria-label="Nawigacja panelu">
              <a href="#services" className={tab === 'services' ? 'active' : ''} onClick={(e)=>{e.preventDefault(); setTabAndClear('services');}}>
                <Icons.Grid style={{width:18,height:18}} /> Moje usługi
              </a>
              <a href="#licenses" className={tab === 'licenses' ? 'active' : ''} onClick={(e)=>{e.preventDefault(); setTabAndClear('licenses');}}>
                <Icons.Key style={{width:18,height:18}} /> Moje Licencje
              </a>
              <a href="#tickets" className={tab === 'tickets' ? 'active' : ''} onClick={(e)=>{e.preventDefault(); setTabAndClear('tickets');}}>
                <Icons.Ticket style={{width:18,height:18}} /> Moje Zgłoszenia
              </a>
            </nav>
          </aside>

          <main className="main">
            <div className="mobile-top" style={{display:'none'}}></div>

            <div className="topbar">
              <div style={{minWidth:0}}>
                <h1>{title}</h1>
                <div className="crumb">Panel klienta</div>
              </div>
              <TopbarRight />
            </div>

            <div className="content">
              <TabView />
            </div>
          </main>

          <div className={"toast " + (toast.show ? "show" : "")} role="status" aria-live="polite">
            {toast.text}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('app')).render(<App />);
  </script>
</body>
</html>
